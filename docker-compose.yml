services:
  postgres:
    image: postgres:18
    container_name: postgresql
    environment:
      POSTGRES_DB: business
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # ボリュームが空の初回起動時にのみ実行される
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      local_test_network:
        ipv4_address: 172.21.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d business"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  local_test_network:
    external: true
