spring.application.name=spring-batch-example

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.business.datasource.url=jdbc:postgresql://localhost:5432/business
spring.business.datasource.driver-class-name=org.postgresql.Driver
spring.business.datasource.username=postgres
spring.business.datasource.password=postgres

spring.batch.jdbc.initialize-schema=always
